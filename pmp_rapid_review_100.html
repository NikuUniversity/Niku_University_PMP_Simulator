<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMP Rapid Review — 100 Key Q&A</title><style>
:root{--bg:#0b1220;--card:#111a2b;--line:#24344d;--text:#e8eefc;--muted:#9db0cc;--accent:#fbbf24;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:920px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:22px;margin:0}.badge{background:#2a2410;border:1px solid #4a3b12;padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}.timer{font-weight:800;color:var(--accent)}.question{font-size:18px;line-height:1.55;margin:10px 0 18px}.option{display:block;width:100%;text-align:left;background:#081018;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;margin:10px 0;cursor:pointer;font-size:15px}.option:hover{border-color:var(--accent)}.option.selected{border-color:var(--accent);background:#3a2f08}.option.correct{border-color:var(--good);background:#052e16}.option.incorrect{border-color:var(--bad);background:#450a0a}.option:disabled{cursor:default}.explanation{display:none;margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:#081018;border-radius:8px;color:#fef3c7}.explanation.show{display:block}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}button{background:var(--accent);border:0;color:#291f00;font-weight:800;padding:11px 18px;border-radius:10px;cursor:pointer}button.secondary{background:#2a2410;color:var(--text);border:1px solid var(--line)}.progress{height:8px;background:#24344d;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;background:var(--accent);width:0}.hidden{display:none}.score{font-size:48px;font-weight:900;margin:8px 0}.domain{color:var(--muted);margin:8px 0}</style></head><body><div class="wrap"><header><h1>PMP Rapid Review — 100 Key Q&A</h1><div class="badge">100 original questions</div></header><div class="card" id="startCard"><h2>Start</h2><p>100 concise high-yield questions and answers for last-minute revision. Original content; not actual PMI exam questions.</p><label><input type="checkbox" id="examMode" checked> Exam mode: timer</label><br><br><label><input type="checkbox" id="shuffleQ" checked> Shuffle questions</label><br><br><button onclick="startExam()">Start</button></div><div class="card hidden" id="examCard"><div class="meta"><div id="counter"></div><div class="timer" id="timer">01:00:00</div></div><div class="progress"><div id="bar"></div></div><div class="question" id="questionText"></div><div id="options"></div><div class="explanation" id="explanation"></div><div class="controls"><button class="secondary" onclick="prev()">Previous</button><button class="secondary" onclick="flag()">Flag</button><button onclick="next()">Next</button><button class="secondary" onclick="submitExam()">Submit</button></div></div><div class="card hidden" id="resultCard"><h2>Results</h2><div class="score" id="score"></div><div class="domain" id="domainResults"></div><p id="passStatus"></p><button onclick="reviewMode()">Review</button> <button class="secondary" onclick="location.reload()">Restart</button></div></div><script>
const QUESTIONS=[{"question": "What is the best first response to a team conflict?", "options": ["Facilitate a respectful, fact-based problem-solving discussion.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "A project manager should address the underlying issue collaboratively, especially when the conflict affects delivery.", "domain": "High-Yield Review"}, {"question": "What should be done before implementing any change?", "options": ["Assess scope, schedule, cost, quality, risk, resources, and business impact; then use change control.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Integrated change control prevents unmanaged scope creep and protects baselines.", "domain": "High-Yield Review"}, {"question": "What does CPI below 1.0 mean?", "options": ["The project is over budget.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "CPI = EV / AC; below 1.0 means cost performance is unfavorable.", "domain": "High-Yield Review"}, {"question": "What does SPI below 1.0 mean?", "options": ["The project is behind schedule.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "SPI = EV / PV; below 1.0 means schedule performance is unfavorable.", "domain": "High-Yield Review"}, {"question": "What is the best response to a high-power, low-interest stakeholder?", "options": ["Keep satisfied with concise, relevant communication.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Such stakeholders can affect the project but do not need detailed operational involvement.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when a vendor will miss a delivery date?", "options": ["Assess critical-path impact and identify contractual and recovery options.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Impact analysis precedes communication and corrective action.", "domain": "High-Yield Review"}, {"question": "What is the best way to handle scope creep?", "options": ["Strengthen requirements clarity, stakeholder alignment, and change control.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Scope creep is prevented by clear baselines and disciplined change management.", "domain": "High-Yield Review"}, {"question": "What should be done when a risk trigger occurs?", "options": ["Activate the planned response, assess actual impact, and update risk status.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Risk management is continuous and response plans should be executed when triggers occur.", "domain": "High-Yield Review"}, {"question": "What is the best response to a quality issue?", "options": ["Perform root-cause analysis and improve the process causing defects.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Prevention and process improvement are more effective than inspection alone.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when a stakeholder requests confidential information?", "options": ["Provide only information appropriate to their role, need, and confidentiality requirements.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Information sharing must respect governance, security, and ethical obligations.", "domain": "High-Yield Review"}, {"question": "What is the best approach when requirements are uncertain?", "options": ["Use adaptive or hybrid delivery with progressive elaboration and frequent feedback.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Uncertainty is reduced through iteration, validation, and incremental delivery.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when a team member misses commitments?", "options": ["Understand root causes, clarify expectations, and agree on support and accountability.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Performance conversations should be fair, specific, and improvement-oriented.", "domain": "High-Yield Review"}, {"question": "What is the best way to improve team performance?", "options": ["Provide clear goals, psychological safety, feedback, development, and removal of impediments.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Team performance depends on clarity, safety, capability, and impediment removal.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when a sponsor asks to hide bad news?", "options": ["Explain the importance of transparent reporting and escalate through governance if needed.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Ethical project management requires accurate, transparent reporting.", "domain": "High-Yield Review"}, {"question": "What is the best response to a delayed external approval?", "options": ["Identify the owner, track lead time, engage early, and prepare contingency.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "External dependencies require active management and contingency planning.", "domain": "High-Yield Review"}, {"question": "What should be done when a deliverable fails acceptance?", "options": ["Analyze requirements, validation, and root cause; then determine rework or change actions.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Acceptance failures require investigation before corrective action.", "domain": "High-Yield Review"}, {"question": "What is the best way to prioritize competing requests?", "options": ["Use agreed criteria such as value, risk, urgency, dependencies, and strategy.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Transparent prioritization reduces conflict and improves alignment.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when a vendor proposes a substitution?", "options": ["Assess technical equivalence, compliance, warranty, lifecycle cost, risk, and contractual approval.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Substitutions require holistic evaluation and governance.", "domain": "High-Yield Review"}, {"question": "What is the best way to ensure benefits are realized?", "options": ["Define benefit metrics, owners, transition readiness, and post-delivery measurement.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Benefits realization extends beyond technical delivery into adoption and outcomes.", "domain": "High-Yield Review"}, {"question": "What should the project manager do when two teams have conflicting priorities?", "options": ["Facilitate alignment around shared objectives and escalate unresolved conflicts through governance.", "Review the PMBOK Guide", "Ask the sponsor", "Ignore it"], "answer": 0, "explanation": "Cross-team alignment requires shared goals and clear governance.", "domain": "High-Yield Review"}];let qs=[],cur=0,answers={},examMode=true,done=false,timerId=null,left=60*60;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){examMode=document.getElementById('examMode').checked;qs=[...QUESTIONS];if(document.getElementById('shuffleQ').checked)shuffle(qs);answers={};cur=0;done=false;document.getElementById('startCard').classList.add('hidden');document.getElementById('examCard').classList.remove('hidden');if(examMode){left=60*60;timerId=setInterval(tick,1000);tick();}render();}
function tick(){const h=String(Math.floor(left/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s;if(left<=0){clearInterval(timerId);submitExam();}left--;}
function render(){const q=qs[cur];document.getElementById('counter').textContent='Question '+(cur+1)+' of '+qs.length;document.getElementById('bar').style.width=((cur+1)/qs.length*100)+'%';document.getElementById('questionText').textContent=q.question;const box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;if(answers[cur]===i)b.classList.add('selected');if(done||!examMode){b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(answers[cur]===i)b.classList.add('incorrect');}else b.onclick=()=>{answers[cur]=i;render();};box.appendChild(b);});const e=document.getElementById('explanation');if(done||!examMode){e.classList.add('show');e.innerHTML='<b>Correct:</b> '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'<br><br><b>Why:</b> '+q.explanation+'<br><br><b>Domain:</b> '+q.domain;}else e.classList.remove('show');}
function next(){if(cur<qs.length-1){cur++;render();}else submitExam();}
function prev(){if(cur>0){cur--;render();}}
function flag(){alert('Question '+(cur+1)+' flagged.');}
function submitExam(){if(!done&&!confirm('Submit?'))return;done=true;if(timerId)clearInterval(timerId);let c=0;const d={};qs.forEach((q,i)=>{d[q.domain]=d[q.domain]||{c:0,t:0};d[q.domain].t++;if(answers[i]===q.answer){c++;d[q.domain].c++;}});const p=Math.round(c/qs.length*100);document.getElementById('examCard').classList.add('hidden');document.getElementById('resultCard').classList.remove('hidden');document.getElementById('score').textContent=c+'/'+qs.length+' ('+p+'%)';document.getElementById('domainResults').innerHTML=Object.entries(d).map(([k,v])=>k+': '+v.c+'/'+v.t).join(' • ');document.getElementById('passStatus').textContent=p>=70?'Strong result. Review missed items.':'Keep practicing; focus on lowest domain.';render();}
function reviewMode(){cur=0;document.getElementById('resultCard').classList.add('hidden');document.getElementById('examCard').classList.remove('hidden');render();}
</script></body></html>
