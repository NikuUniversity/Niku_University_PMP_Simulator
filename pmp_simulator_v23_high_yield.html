 class="badge">180 original questions</div></header><div class="card" id="startCard"><h2>Start</h2><p>180 original high-yield PMP-style questions focused on commonly tested concepts. Original content; not actual PMI exam questions.</p><label><input type="checkbox" id="examMode" checked> Exam mode: timer</label><br><br><label><input type="checkbox" id="shuffleQ" checked> Shuffle questions</label><br><br><button onclick="startExam()">Start</button></div><div class="card hidden" id="examCard"><div class="meta"><div id="counter"></div><div class="timer" id="timer">03:50:00</div></div><div class="progress"><div id="bar"></div></div><div class="question" id="questionText"></div><div id="options"></div><div class="explanation" id="explanation"></div><div class="controls"><button class="secondary" onclick="prev()">Previous</button><button class="secondary" onclick="flag()">Flag</button><button onclick="next()">Next</button><button class="secondary" onclick="submitExam()">Submit</button></div></div><div class="card hidden" id="resultCard"><h2>Results</h2><div class="score" id="score"></div><div class="domain" id="domainResults"></div><p id="passStatus"></p><button onclick="reviewMode()">Review</button> <button class="secondary" onclick="location.reload()">Restart</button></div></div><script>
const QUESTIONS=[{"question": "A stakeholder asks the project manager to make a decision that benefits one group but harms another. What should the project manager do first?", "options": ["Choose the group with more influence", "Delay the decision indefinitely", "Assess value, impact, fairness, and governance implications before deciding", "Delegate it without analysis"], "answer": 2, "explanation": "Ethical, value-based decisions require impact assessment, fairness, and appropriate governance.", "domain": "Business"}, {"question": "In a digital banking rollout, a team member says a requirement is unclear. What should the project manager do first?", "options": ["Remove the requirement", "Facilitate clarification with the stakeholder and document the agreed requirement", "Ask the team to interpret it", "Proceed with assumptions"], "answer": 1, "explanation": "Ambiguity should be resolved with the stakeholder and documented before build work proceeds.", "domain": "Process"}, {"question": "A project manager receives a change request late in delivery. What should the project manager do first?", "options": ["Assess impacts on scope, schedule, cost, quality, risk, and benefits, then use change control", "Ask the team to decide", "Implement it to satisfy the stakeholder", "Reject it because delivery is late"], "answer": 0, "explanation": "All changes require integrated impact assessment and change control, regardless of project phase.", "domain": "Process"}, {"question": "In a digital banking rollout, a key stakeholder is highly influential but disengaged. What is the best engagement approach?", "options": ["Manage closely with daily technical updates", "Keep satisfied through concise, relevant executive communication", "Ignore until closure", "Monitor with minimal effort"], "answer": 1, "explanation": "High-power, low-interest stakeholders generally need to be kept satisfied through focused communication.", "domain": "People"}, {"question": "A team is missing sprint goals because requirements change daily. What should the project manager do first?", "options": ["Move to predictive delivery immediately", "Ask the team to work faster", "Clarify product goals, backlog ownership, and change-management approach", "Increase sprint length"], "answer": 2, "explanation": "Adaptive delivery needs clear product goals, backlog ownership, and a controlled approach to changing priorities.", "domain": "Process"}, {"question": "In a digital banking rollout, a project manager identifies a risk that could delay a regulatory approval. What is the best response?", "options": ["Accept it because approvals are uncertain", "Ignore it until it occurs", "Transfer it to the regulator", "Create a mitigation plan, assign an owner, and track triggers and lead time"], "answer": 3, "explanation": "Regulatory risks require active mitigation, ownership, trigger tracking, and contingency planning.", "domain": "Process"}, {"question": "A deliverable meets specifications but the customer is dissatisfied. What should the project manager do first?", "options": ["Review requirements traceability, validation criteria, and stakeholder expectations", "Ask the customer to accept it", "Declare success", "Rebuild without analysis"], "answer": 0, "explanation": "Dissatisfaction may indicate a requirements, validation, or expectation-management gap that should be investigated.", "domain": "Process"}, {"question": "In a digital banking rollout, a project manager must communicate a schedule slip. What is the best approach?", "options": ["Wait until the date passes", "Communicate promptly with impact, root cause, options, and a recommended action", "Report only positive news", "Blame another team"], "answer": 1, "explanation": "Transparent, timely communication with analysis and options supports stakeholder trust and decision-making.", "domain": "Business"}, {"question": "A team member completes work but does not update the board. What should the project manager do first?", "options": ["Understand the barrier and reinforce the value of timely, accurate updates", "Issue a warning", "Update it themselves", "Remove the board"], "answer": 0, "explanation": "The project manager should identify root causes such as tool friction, workload, or unclear expectations before enforcing compliance.", "domain": "People"}, {"question": "In a hospital system implementation, a sponsor asks the project manager to start work before funding approval. What is the appropriate response?", "options": ["Start work to maintain momentum", "Ask the team to volunteer", "Explain that authorization and funding approval are required before work begins", "Start low-cost work quietly"], "answer": 2, "explanation": "Work should begin only with proper authorization and funding to protect governance and accountability.", "domain": "Business"}, {"question": "A project has a CPI of 0.80 and SPI of 0.85. What should the project manager do first?", "options": ["Celebrate progress", "Analyze variances, identify root causes, and develop corrective actions", "Reduce scope silently", "Request more budget immediately"], "answer": 1, "explanation": "Both indexes below 1.0 indicate cost and schedule problems; root-cause analysis should precede corrective action.", "domain": "Process"}, {"question": "In a hospital system implementation, a team identifies a defect that could affect safety. What should the project manager do first?", "options": ["Release and fix later", "Reclassify the defect", "Delay all work", "Contain the issue, assess impact, and initiate corrective and preventive action"], "answer": 3, "explanation": "Safety issues require immediate containment, impact assessment, and corrective/preventive action.", "domain": "Process"}, {"question": "A stakeholder requests a feature that conflicts with another stakeholder’s priority. What should the project manager do first?", "options": ["Implement both", "Facilitate alignment using value, risk, dependency, and strategic criteria", "Choose the senior stakeholder", "Reject both"], "answer": 1, "explanation": "Conflicting priorities should be resolved through transparent criteria and governance escalation if needed.", "domain": "People"}, {"question": "In a hospital system implementation, a project manager must decide whether to outsource work. What is the most relevant consideration?", "options": ["Only vendor reputation", "Only cost", "Capability, capacity, IP, quality, security, schedule, risk, and management overhead", "Only location"], "answer": 2, "explanation": "Outsourcing decisions require holistic evaluation of capability, risk, IP, security, cost, and oversight.", "domain": "Process"}, {"question": "A project manager notices that a team is spending too much time in meetings. What is the best response?", "options": ["Add more meetings", "Record meetings instead of deciding", "Cancel all collaboration", "Clarify meeting purpose, attendees, decisions, and use asynchronous alternatives"], "answer": 3, "explanation": "Meeting effectiveness improves by clarifying purpose, limiting attendees, and using asynchronous options where appropriate.", "domain": "People"}, {"question": "In a hospital system implementation, a project manager receives conflicting direction from two sponsors. What should the project manager do?", "options": ["Facilitate alignment and document the agreed direction", "Stop work indefinitely", "Follow the more senior sponsor", "Follow both directions"], "answer": 0, "explanation": "Conflicting sponsorship should be resolved through facilitation, alignment, and documented governance.", "domain": "Business"}, {"question": "A project manager identifies that a milestone depends on an external approval. What is the best response?", "options": ["Assume approval will occur", "Identify the owner, track lead time, engage early, and prepare contingency", "Remove the milestone", "Delay all work"], "answer": 1, "explanation": "External approvals require early engagement, lead-time tracking, ownership, and contingency planning.", "domain": "Process"}, {"question": "In a hospital system implementation, a team member asks for feedback but becomes defensive. What is the best approach?", "options": ["Use specific, behavior-based feedback and agree on follow-up actions", "Give feedback publicly", "Stop giving feedback", "Avoid performance discussions"], "answer": 0, "explanation": "Effective feedback is private, specific, respectful, and focused on observable behavior and next steps.", "domain": "People"}, {"question": "A project manager must determine whether to accept a low bid. What should be evaluated?", "options": ["Only references", "Only delivery date", "Total cost of ownership, capability, quality, capacity, risk, and contract terms", "Only price"], "answer": 2, "explanation": "Low bids must be evaluated for total value, capability, quality, risk, and contract terms.", "domain": "Process"}, {"question": "In a manufacturing automation project, a project manager must improve adoption of a new system. What should be planned?", "options": ["Readiness, training, support, communication, and adoption metrics", "Only go-live date", "Only documentation", "Only technical deployment"], "answer": 0, "explanation": "Adoption requires readiness, enablement, support, communication, and measurement—not deployment alone.", "domain": "Business"}, {"question": "A stakeholder asks the project manager to make a decision that benefits one group but harms another. What should the project manager do first?", "options": ["Choose the group with more influence", "Delay the decision indefinitely", "Assess value, impact, fairness, and governance implications before deciding", "Delegate it without analysis"], "answer": 2, "explanation": "Ethical, value-based decisions require impact assessment, fairness, and appropriate governance.", "domain": "Business"}, {"question": "In a manufacturing automation project, a team member says a requirement is unclear. What should the project
