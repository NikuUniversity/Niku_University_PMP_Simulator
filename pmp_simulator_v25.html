earning, rebuild confidence", "Discuss publicly", "Assign more work", "Ignore failure"], "answer": 0, "explanation": "Resilience is supported by acknowledgment, learning, and achievable progress.", "domain": "People"}, {"question": "In an automotive connected-fleet program, a stakeholder asks why a risk was accepted. What should the project manager do?", "options": ["Say it was minor", "Avoid discussion", "Explain assessment, tolerance, cost-benefit, and monitoring", "Share only register"], "answer": 2, "explanation": "Risk acceptance should be explained through assessment and monitoring.", "domain": "People"}, {"question": "A project manager must determine whether to compress a schedule. What should be assessed first?", "options": ["Only compression amount", "Only sponsor preference", "Critical path, dependencies, cost, quality, risk, commitments", "Only availability"], "answer": 2, "explanation": "Compression requires integrated assessment of path, dependencies, cost, quality, risk.", "domain": "Process"}, {"question": "In a flood monitoring project, a project manager identifies repeated rework. What is the best first response?", "options": ["Blame workers", "Accept defects", "Root-cause analysis and process improvement", "Increase inspection"], "answer": 2, "explanation": "Repeated rework signals process or requirements issues to fix at source.", "domain": "Process"}, {"question": "A project manager must decide whether to use a pilot. What is the best benefit?", "options": ["Avoids measurement", "Eliminates change management", "Validates assumptions and reduces risk before rollout", "Removes training"], "answer": 2, "explanation": "Pilots validate assumptions and reduce risk before broader rollout.", "domain": "Process"}, {"question": "In a flood monitoring project, a project manager identifies that a risk response is ineffective. What should the project manager do first?", "options": ["Close the risk", "Transfer risk", "Ignore risk", "Reassess residual exposure her to close a project early. What should be reviewed?", "options": ["Only budget", "Only schedule", "Business case, value, risks, alternatives, governance", "Only morale"], "answer": 2, "explanation": "Early closure requires value, business case, risk, and governance review.", "domain": "Business"}];let qs=[],cur=0,answers={},examMode=true,done=false,timerId=null,left=230*60;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){examMode=document.getElementById('examMode').checked;qs=[...QUESTIONS];if(document.getElementById('shuffleQ').checked)shuffle(qs);answers={};cur=0;done=false;document.getElementById('startCard').classList.add('hidden');document.getElementById('examCard').classList.remove('hidden');if(examMode){left=230*60;timerId=setInterval(tick,1000);tick();}render();}
function tick(){const h=String(Math.floor(left/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s;if(left<=0){clearInterval(timerId);submitExam();}left--;}
function render(){const q=qs[cur];document.getElementById('counter').textContent='Question '+(cur+1)+' of '+qs.length;document.getElementById('bar').style.width=((cur+1)/qs.length*100)+'%';document.getElementById('questionText').textContent=q.question;const box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;if(answers[cur]===i)b.classList.add('selected');if(done||!examMode){b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(answers[cur]===i)b.classList.add('incorrect');}else b.onclick=()=>{answers[cur]=i;render();};box.appendChild(b);});const e=document.getElementById('explanation');if(done||!examMode){e.classList.add('show');e.innerHTML='<b>Correct:</b> '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'<br><br><b>Why:</b> '+q.explanation+'<br><br><b>Domain:</b> '+q.domain;}else e.classList.remove('show');}
function next(){if(cur<qs.length-1){cur++;render();}else submitExam();}
function prev(){if(cur>0){cur--;render();}}

function submitExam(){if(!done&&!confirm('Submit?'))return;done=true;if(timerId)clearInterval(timerId);let c=0;const d={};qs.forEach((q,i)=>{d[q.domain]=d[q.domain]||{c:0,t:0};d[q.domain].t++;if(answers[i]===q.answer){c++;d[q.domain].c++;}});const p=Math.round(c/qs.length*100);document.getElementById('examCard').classList.add('hidden');document.getElementById('resultCard').classList.remove('hidden');document.getElementById('score').textContent=c+'/180 ('+p+'%)';document.getElementById('domainResults').innerHTML=Object.entries(d).map(([k,v])=>k+': '+v.c+'/'+v.t).join(' • ');document.getElementById('passStatus').textContent=p>=75?'Strong. Review misses.':'Keep practicing.';render();}
